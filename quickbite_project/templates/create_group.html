{% extends 'base.html' %}

{% block title %}Create Group - QuickBite{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="section-title">👥 Create Group Order</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Group Name</label>
                    <input type="text" name="name" class="form-control"
                           placeholder="e.g. Friday Lunch" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Create Group</button>
                <a href="{% url 'group_list' %}" class="btn btn-primary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
