{% extends 'base.html' %}

{% block title %}Register - QuickBite{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-5">
            <h3 class="section-title">📝 Create Account</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-2">Register</button>
            </form>
            <p class="mt-3 text-center">
                Already have an account?
                <a href="{% url 'login' %}" style="color:#00b4d8;">Login</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
