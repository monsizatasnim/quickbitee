{% extends 'base.html' %}

{% block title %}Payment Success - QuickBite{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card p-5">
            <h2 style="color:#2a9d8f;">✅ Payment Successful!</h2>
            <p class="mt-3"><strong>Order ID:</strong> #{{ order.id }}</p>
            <p><strong>Transaction ID:</strong> {{ transaction_id }}</p>
            <a href="{% url 'order_detail' order.id %}" class="btn btn-primary mt-3">
                📦 View Order
            </a>
        </div>
    </div>
</div>

{% endblock %}
